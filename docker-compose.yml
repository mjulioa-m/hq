services:
  db:
    image: postgres:16-alpine
    container_name: hq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: hq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}
      POSTGRES_DB: hq
    volumes:
      - hq_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hq -d hq"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: hq-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://hq:${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD}@hq-db:5432/hq
      AUTH_URL: ${APP_URL}
      TZ: America/Bogota
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hq_uploads:/app/data
    expose:
      - "3000"
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?define PROXY_NETWORK}

volumes:
  hq_pgdata:
  hq_uploads:
